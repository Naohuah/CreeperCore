[package]
name = "creeper-core-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "苦力怕启动器 — a creeper-themed Minecraft launcher."

[lib]
name = "creeper_core_launcher"
path = "src/lib.rs"

[[bin]]
name = "creeper-core-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
creeper-core = { path = "../core" }
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# this feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
